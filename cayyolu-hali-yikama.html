<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çayyolu VIP Halı & Koltuk Yıkama | Profesyonel Hijyen Merkezi</title>
    <meta name="description" content="Çayyolu, Ümitköy, Yaşamkent ve Bağlıca bölgelerinde profesyonel halı yıkama. Tam otomatik makineler ve antibakteriyel bitkisel şampuanlarla garantili temizlik.">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #0f172a;
            --accent: #38bdf8;
            --text-main: #334155;
            --bg-light: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-main); scroll-behavior: smooth; overflow-x: hidden; }

        /* --- Glassmorphism Navigation --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--secondary); letter-spacing: -1px; }
        .logo span { color: var(--primary); }

        /* --- Hero Section --- */
        .hero {
            height: 90vh; min-height: 600px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.7) 100%), 
                        url('https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=1400');
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 0 20px; color: white;
        }
        .hero-content { max-width: 900px; animation: fadeInUp 1s ease; }
        .hero-content h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 25px; }
        .hero-content p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 35px; max-width: 600px; margin-inline: auto; }

        .cta-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn-v { 
            padding: 18px 35px; border-radius: 12px; font-weight: 700; text-decoration: none; 
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-v-primary { background: var(--primary); color: white; }
        .btn-v-outline { border: 2px solid white; color: white; }
        .btn-v:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* --- Stats (Intersection Observer ile Çalışan Sayaçlar) --- */
        .section-stats { margin-top: -80px; position: relative; z-index: 10; padding: 0 20px; }
        .stats-grid { 
            max-width: 1100px; margin: 0 auto; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; 
        }
        .stat-box { 
            background: white; padding: 40px; border-radius: 24px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); border-bottom: 5px solid var(--primary);
        }
        .stat-box h3 { font-size: 2.5rem; font-weight: 800; color: var(--secondary); margin-bottom: 5px; }

        /* --- SEO Content Silo --- */
        .section { padding: 80px 20px; max-width: 1200px; margin: 0 auto; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 50px; align-items: center; }
        
        .badge { background: #d1fae5; color: #065f46; padding: 6px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        h2 { font-size: 2.2rem; font-weight: 800; color: var(--secondary); margin: 15px 0; }
        .seo-text { font-size: 1.1rem; color: #64748b; margin-bottom: 20px; }

        /* --- Modern Service Cards --- */
        .services-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .s-card { 
            background: white; padding: 30px; border-radius: 20px; 
            border: 1px solid #e2e8f0; transition: 0.4s;
        }
        .s-card:hover { border-color: var(--primary); background: #f0fdf4; }
        .s-card i { font-size: 2.5rem; display: block; margin-bottom: 20px; }

        /* --- WhatsApp Floating Form --- */
        .form-container { 
            background: var(--secondary); color: white; padding: 50px; border-radius: 30px; 
            position: relative; overflow: hidden;
        }
        .form-container::after { 
            content: ''; position: absolute; top: -50px; right: -50px; 
            width: 200px; height: 200px; background: var(--primary); opacity: 0.1; border-radius: 50%; 
        }
        input, textarea { 
            width: 100%; padding: 18px; margin-bottom: 15px; background: #1e293b; 
            border: 1px solid #334155; border-radius: 12px; color: white; font-size: 1rem;
        }

        /* --- Mobile Sticky Footer --- */
        .mobile-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            padding: 10px; border-radius: 100px; display: none; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 1000;
        }
        .m-btn { 
            padding: 15px; border-radius: 50px; text-align: center; text-decoration: none; 
            color: white; font-weight: 700; font-size: 0.9rem;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .mobile-bar { display: grid; }
            .section { padding: 50px 20px; }
            .hero { height: 80vh; }
            .hero-content h1 { font-size: 2.2rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">YAPRAK<span>HALI</span></div>
    <div class="contact-info" style="font-weight: 700; color: var(--primary); font-size: 0.9rem; display: none;">
        <a href="tel:05362333675" style="text-decoration: none; color: inherit;">📞 0536 233 3675</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-content">
        <span class="badge" style="background: var(--primary); color: white;">Çayyolu'nun 1 Numaralı Fabrikası</span>
        <h1>Kusursuz Temizlik, <br>Vip Hizmet Kalitesi</h1>
        <p>Halılarınızın dokusunu koruyan, bitkisel içerikli Alman teknolojisi şampuanlar ve tam otomatik sistemlerle hizmetinizdeyiz.</p>
        <div class="cta-group">
            <a href="https://wa.me/905362333675" class="btn-v btn-v-primary">WhatsApp Teklif Al</a>
            <a href="tel:05362333675" class="btn-v btn-v-outline">📞 Servis Çağır</a>
        </div>
    </div>
</section>

<section class="stats-grid">
    <div class="stat-box">
        <h3 class="counter" data-target="47177">0</h3>
        <p>Mutlu Müşteri</p>
    </div>
    <div class="stat-box">
        <h3 class="counter" data-target="235836">0</h3>
        <p>Yıkanan Halı (m²)</p>
    </div>
</section>

<form onsubmit="sendProfessionalLead(event)">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" id="pName" placeholder="Adınız Soyadınız" required>
        <input type="tel" id="pPhone" placeholder="Telefon Numaranız" required>
    </div>
    <textarea id="pTask" rows="4" placeholder="Hangi bölgedesiniz ve ne yıkanacak? (Örn: Ümitköy, 2 adet shaggy halı)" required></textarea>
    <button type="submit" class="btn-v-primary">Şimdi Ücretsiz Teklif Al</button>
</form>

<script>
// --- 1. SAYAÇ MOTORU (Gelişmiş ve Akıcı) ---
const startCounters = () => {
    const counters = document.querySelectorAll('.counter');
    
    counters.forEach(counter => {
        const updateCount = () => {
            const target = +counter.getAttribute('data-target'); // Hedef rakam
            const count = +counter.innerText.replace(/\./g, ''); // Mevcut rakam
            
            // Hız ayarı: Rakam büyüdükçe artış hızı artar
            const speed = target / 100; 

            if (count < target) {
                const nextCount = Math.ceil(count + speed);
                // Rakamı binlik ayırıcı ile (nokta) formatlayarak yazdır
                counter.innerText = nextCount > target ? target.toLocaleString('tr-TR') : nextCount.toLocaleString('tr-TR');
                setTimeout(updateCount, 20);
            } else {
                counter.innerText = target.toLocaleString('tr-TR');
            }
        };
        updateCount();
    });
};

// Sayfa kaydırıldığında sayaçları tetikle
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            startCounters();
            observer.unobserve(entry.target); // Sadece bir kez çalışması için
        }
    });
}, { threshold: 0.5 });

document.querySelectorAll('.stats-grid').forEach(grid => observer.observe(grid));


// --- 2. WHATSAPP FORM GÖNDERİMİ (Hata Giderilmiş) ---
function sendProfessionalLead(e) {
    e.preventDefault(); // Sayfanın yenilenmesini engeller
    
    // Form elemanlarını al
    const name = document.getElementById('pName').value.trim();
    const phone = document.getElementById('pPhone').value.trim();
    const task = document.getElementById('pTask').value.trim();
    
    // Numaranı buraya başına 90 koyarak yaz (Örn: 90536...)
    const myNumber = "905362333675"; 
    
    // Mesaj içeriğini oluştur
    const message = 🌟 *Yeni Servis Talebi* 🌟%0A +
                    --------------------------%0A +
                    👤 *Müşteri:* ${name}%0A +
                    📞 *Telefon:* ${phone}%0A +
                    📝 *İstek:* ${task}%0A +
                    --------------------------%0A +
                    _Bu mesaj yaprakhaliyikama.net üzerinden gönderildi._;
    
    // WhatsApp'a yönlendir
    const whatsappUrl = https://wa.me/${myNumber}?text=${message};
    window.open(whatsappUrl, '_blank');
}
</script>
</body>
</html>

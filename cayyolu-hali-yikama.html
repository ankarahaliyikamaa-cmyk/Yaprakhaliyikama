<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çayyolu Halı Yıkama & Koltuk Yıkama | Aynı Gün Servis | Ankara</title>

<meta name="description" content="Çayyolu halı yıkama ve koltuk yıkama hizmeti. Aynı gün servis. Hemen ara!">
<meta name="keywords" content="çayyolu halı yıkama, koltuk yıkama ankara">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins;margin:0;background:#f4f6f9}
header{background:#0a3d62;color:#fff;text-align:center;padding:40px}
.container{padding:20px;max-width:1000px;margin:auto}
.card{background:#fff;padding:20px;margin:15px 0;border-radius:10px}
.btn{padding:12px 20px;border-radius:8px;color:#fff;text-decoration:none;margin:5px;display:inline-block}
.call{background:#27ae60}
.wp{background:#25D366}
.counter{font-size:40px;font-weight:700}
.popup{position:fixed;bottom:20px;left:20px;background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.2);display:none}
</style>
</head>

<body>

<header>
<h1>Çayyolu Halı & Koltuk Yıkama</h1>
<a href="tel:05362333675" class="btn call">Ara</a>
<a href="https://wa.me/905362333675" class="btn wp">WhatsApp</a>
</header>

<div class="container">

<div class="card">
<h2 id="musteri" class="counter">0</h2>
<p>Mutlu Müşteri</p>
</div>

<div class="card">
<h2 id="hali" class="counter">0</h2>
<p>Yıkanan Halı</p>
</div>

</div>

<div class="popup" id="popup"></div>

<script>
function formatNumber(num){return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}

function animateCounter(el,target){let start=0;let inc=target/100;function update(){start+=inc;if(start>=target){el.innerText='+ '+formatNumber(target)}else{el.innerText='+ '+formatNumber(Math.floor(start));requestAnimationFrame(update)}}update()}

function startCounters(){animateCounter(document.getElementById('musteri'),47177);animateCounter(document.getElementById('hali'),235836)}

window.onload=startCounters;

// FAKE LIVE POPUP
const names=["Ahmet","Mehmet","Ayşe","Fatma","Ali","Veli"];
function showPopup(){
let popup=document.getElementById('popup');
let name=names[Math.floor(Math.random()*names.length)];
popup.innerText=name+" az önce hizmet aldı";
popup.style.display='block';
setTimeout(()=>popup.style.display='none',3000);
}
setInterval(showPopup,5000);

// FAKE TODAY COUNTER
let today=12;
setInterval(()=>{today++;document.title='Bugün '+today+' kişi aradı!';},4000);
</script>

</body>
</html>

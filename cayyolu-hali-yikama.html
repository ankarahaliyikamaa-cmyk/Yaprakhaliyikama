<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çayyolu Halı & Koltuk Yıkama | Aynı Gün Servis</title>
<meta name="description" content="Çayyolu halı ve koltuk yıkama. Aynı gün servis, uygun fiyat.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins;margin:0;background:#f4f6f9}
header{background:url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?q=80&w=1200') center/cover;color:#fff;text-align:center;padding:100px 20px}
h1{font-size:34px;background:rgba(0,0,0,0.5);display:inline-block;padding:10px 20px;border-radius:10px}
.btn{padding:14px 25px;border-radius:10px;color:#fff;text-decoration:none;margin:5px;display:inline-block}
.call{background:#27ae60}
.wp{background:#25D366}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;padding:25px;margin:20px 0;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.08)}
.counter{font-size:42px;font-weight:700}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gallery img{width:100%;border-radius:10px}
form input,form textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
form button{background:#27ae60;color:#fff;border:none;padding:12px;border-radius:8px;width:100%}
.popup{position:fixed;bottom:20px;left:20px;background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.2);display:none}
</style>
</head>
<body>
<header>
<h1>Çayyolu Halı & Koltuk Yıkama</h1><br>
<a href="tel:05362333675" class="btn call">📞 Ara</a>
<a href="https://wa.me/905362333675" class="btn wp">💬 WhatsApp</a>
</header>
<div class="container">
<div class="card"><h2 id="musteri" class="counter">0</h2><p>Mutlu Müşteri</p></div>
<div class="card"><h2 id="hali" class="counter">0</h2><p>Yıkanan Halı</p></div>

<div class="card">
<h2>Hizmetlerimiz</h2>
<p>✔ Halı Yıkama</p>
<p>✔ Koltuk Yıkama</p>
<p>✔ Yatak Yıkama</p>
</div>

<div class="card">
<h2>Galeri</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
<img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
<img src="https://images.unsplash.com/photo-1598300056393-4aac492f4344">
<img src="https://images.unsplash.com/photo-1616628182509-9a7db7bf784c">
</div>
</div>

<div class="card">
<h2>Google Yorumlar</h2>
<p>⭐ 5.0 (25 yorum)</p>
<p>"Harika hizmet"</p>
<p>"Çok memnun kaldım"</p>
</div>

<div class="card">
<h2>Hemen Fiyat Al</h2>
<form onsubmit="sendWhatsApp(event)">
<input type="text" id="ad" placeholder="Adınız" required>
<input type="tel" id="tel" placeholder="Telefon" required>
<textarea id="mesaj" placeholder="Ne temizlenecek?" required></textarea>
<button type="submit">Gönder</button>
</form>
</div>

</div>
<div id="popup" class="popup"></div>

<script>
function formatNumber(num){return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function animateCounter(el,target){let s=0;let i=target/100;function u(){s+=i;if(s>=target){el.innerText='+ '+formatNumber(target)}else{el.innerText='+ '+formatNumber(Math.floor(s));requestAnimationFrame(u)}}u()}
window.onload=function(){animateCounter(document.getElementById('musteri'),47177);animateCounter(document.getElementById('hali'),235836)}

const names=["Ahmet","Mehmet","Ayşe","Fatma","Ali"];
setInterval(()=>{let p=document.getElementById('popup');let n=names[Math.floor(Math.random()*names.length)];p.innerText=n+" az önce hizmet aldı";p.style.display='block';setTimeout(()=>p.style.display='none',3000)},5000);

function sendWhatsApp(e){e.preventDefault();let ad=document.getElementById('ad').value;let tel=document.getElementById('tel').value;let mesaj=document.getElementById('mesaj').value;let url=https://wa.me/905362333675?text=Ad:${ad}%0ATel:${tel}%0Aİş:${mesaj};window.open(url,'_blank');}
</script>
</body>
</html>

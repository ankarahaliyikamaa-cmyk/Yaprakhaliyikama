<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çayyolu Halı & Koltuk Yıkama | Hızlı & Profesyonel</title>
    <meta name="description" content="Çayyolu'nda profesyonel halı ve koltuk yıkama. Ücretsiz servis, uygun fiyat.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #2c3e50;
            --light: #f8fafc;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--light); color: var(--dark); line-height: 1.5; overflow-x: hidden; }

        /* --- Header Fix (Üst üste binme sorunu burada çözüldü) --- */
        header {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1558317374-067fb5f30001?auto=format&fit=crop&q=80&w=1000') center/cover;
            color: white;
            text-align: center;
            padding: 80px 20px 120px 20px; /* Alt boşluk artırıldı */
            position: relative;
        }

        h1 { font-size: 1.8rem; margin: 0 0 20px 0; font-weight: 800; text-transform: uppercase; }

        /* Buton Tasarımları */
        .header-btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .btn-main {
            width: 100%;
            max-width: 280px;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            font-size: 1rem;
        }
        .call-bg { background: #27ae60; }
        .wp-bg { background: #25D366; }

        /* --- Stats (Kartlar) --- */
        .container { 
            max-width: 600px; 
            margin: -60px auto 100px; /* Kartları yukarı taşıyan negatif margin */
            padding: 0 15px; 
            position: relative; 
            z-index: 10;
        }

        .stat-card {
            background: var(--white);
            margin-bottom: 15px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .counter { 
            font-size: 2.8rem; 
            font-weight: 800; 
            color: #3498db; 
            display: block;
            margin-bottom: 5px;
            min-height: 3.5rem; /* Rakam yüklenene kadar alanın boş kalmaması için */
        }
        .stat-label { color: #7f8c8d; font-weight: 600; font-size: 0.95rem; }

        /* Form */
        .form-card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); margin-top: 20px; }
        h3 { margin-top: 0; text-align: center; }
        input, textarea {
            width: 100%; padding: 14px; margin-bottom: 10px;
            border: 1px solid #ddd; border-radius: 12px; font-family: inherit; font-size: 1rem;
        }
        .submit-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: var(--dark); color: white; font-weight: 700; cursor: pointer;
        }

        /* --- Sticky Bottom Nav (Mobildeki alt butonlar) --- */
        .sticky-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 10px 15px 25px 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .sticky-btn {
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Pop-up Bildirim */
        #notify {
            position: fixed;
            bottom: 90px;
            left: 15px;
            right: 15px;
            background: var(--dark);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: none;
            z-index: 999;
            text-align: center;
        }

        @media (min-width: 768px) {
            header { padding: 120px 20px; }
            h1 { font-size: 3rem; }
            .header-btns { flex-direction: row; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <h1>Çayyolu Halı Yıkama</h1>
    <div class="header-btns">
        <a href="tel:05362333675" class="btn-main call-bg">📞 Hemen Ara</a>
        <a href="https://wa.me/905362333675" class="btn-main wp-bg">💬 WhatsApp'tan Yaz</a>
    </div>
</header>

<div class="container">
    <div class="stat-card">
        <span class="counter" id="cust-count">0</span>
        <span class="stat-label">Mutlu Müşteri</span>
    </div>

    <div class="stat-card">
        <span class="counter" id="carpet-count">0</span>
        <span class="stat-label">Yıkanan Halı (m²)</span>
    </div>

    <div class="stat-card">
        <span class="counter">5.0</span>
        <span class="stat-label">Google Yorum Puanı</span>
    </div>

    <div class="form-card">
        <h3>Hızlı Fiyat Al</h3>
        <form onsubmit="sendLead(event)">
            <input type="text" id="fname" placeholder="Adınız" required>
            <input type="tel" id="fphone" placeholder="Telefonunuz" required>
            <textarea id="fmsg" rows="3" placeholder="Ne yıkanacak? (Örn: 2 halı, 1 koltuk)" required></textarea>
            <button type="submit" class="submit-btn">Teklif Gönder</button>
        </form>
    </div>
</div>

<div class="sticky-nav">
    <a href="tel:05362333675" class="sticky-btn call-bg">Hemen Ara</a>
    <a href="https://wa.me/905362333675" class="sticky-btn wp-bg">WhatsApp</a>
</div>

<div id="notify"></div>

<script>
    // Gelişmiş Sayaç Fonksiyonu
    function runCounter(id, target, speed) {
        const el = document.getElementById(id);
        let current = 0;
        const increment = target / (speed / 16); // 60fps hesaplama

        function update() {
            current += increment;
            if (current < target) {
                el.innerText = Math.floor(current).toLocaleString('tr-TR');
                requestAnimationFrame(update);
            } else {
                el.innerText = target.toLocaleString('tr-TR');
            }
        }
        update();
    }

    // Sayfa yüklendiğinde çalıştır
    window.addEventListener('DOMContentLoaded', () => {
        // Hedef sayıları burada belirledik
        runCounter("cust-count", 47177, 2500); // 2.5 saniyede tamamlar
        runCounter("carpet-count", 235836, 2500);
    });

    // Rastgele Bildirimler
    const people = ["Ahmet", "Selin", "Mehmet", "Ayşe", "Burak", "Zeynep"];
    setInterval(() => {
        const notify = document.getElementById('notify');
        const name = people[Math.floor(Math.random() * people.length)];
        notify.innerHTML = ✅ <b>${name}</b> az önce randevu oluşturdu.;
        notify.style.display = 'block';
        setTimeout(() => notify.style.display = 'none', 4000);
    }, 12000);

    // Form Gönderimi
    function sendLead(e) {
        e.preventDefault();
        const name = document.getElementById('fname').value;
        const phone = document.getElementById('fphone').value;
        const msg = document.getElementById('fmsg').value;
        const text = Merhaba, web sitenizden yazıyorum.%0Aİsim: ${name}%0ATelefon: ${phone}%0Aİstek: ${msg};
        window.open(https://wa.me/905362333675?text=${text}, '_blank');
    }
</script>

</body>
</html>

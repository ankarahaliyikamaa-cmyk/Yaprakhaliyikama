<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çayyolu Halı & Koltuk Yıkama | Profesyonel Temizlik</title>
    <meta name="description" content="Çayyolu'nda profesyonel halı, koltuk ve yatak yıkama. Ücretsiz servis, aynı gün randevu. Hemen fiyat alın!">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --light: #f4f6f9; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--light); color: var(--dark); line-height: 1.6; }
        
        header { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1581578731548-c64695cc6952?q=80&w=1200') center/cover; 
            color: #fff; text-align: center; padding: 120px 20px; 
        }
        
        h1 { font-size: 2.5rem; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        
        .btn { padding: 15px 30px; border-radius: 50px; color: #fff; text-decoration: none; font-weight: 600; transition: 0.3s; display: inline-block; margin: 10px; }
        .call { background: var(--primary); box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); }
        .wp { background: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }

        .container { max-width: 1000px; margin: -50px auto 50px; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid var(--primary); }
        
        .counter { font-size: 36px; font-weight: 800; color: var(--primary); margin: 0; }
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; text-align: center; }
        .service-item { background: #f9f9f9; padding: 20px; border-radius: 15px; font-weight: 600; border: 1px solid #eee; }

        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; transition: 0.3s; }
        .gallery img:hover { transform: scale(1.03); }

        form input, form textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; }
        form button { background: var(--dark); color: #fff; border: none; padding: 18px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; }

        .sticky-contact { position: fixed; bottom: 0; left: 0; right: 0; display: flex; z-index: 1000; background: #fff; padding: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .sticky-contact a { flex: 1; margin: 5px; text-align: center; padding: 12px; border-radius: 8px; font-size: 14px; }

        .popup { position: fixed; bottom: 90px; left: 20px; background: var(--dark); color: #fff; padding: 12px 20px; border-radius: 50px; font-size: 13px; display: none; z-index: 999; animation: slideUp 0.5s; }
        @keyframes slideUp { from {transform: translateY(20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        
        @media (max-width: 600px) { h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

<header>
    <h1>Çayyolu Halı & Koltuk Yıkama</h1>
    <p>Sağlıklı Temizlik, Mutlu Yuvalar</p>
    <div class="header-btns">
        <a href="tel:05362333675" class="btn call">📞 Hemen Ara</a>
        <a href="https://wa.me/905362333675" class="btn wp">💬 WhatsApp Mesaj</a>
    </div>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="card"><h2 id="musteri" class="counter">0</h2><p>Mutlu Müşteri</p></div>
        <div class="card"><h2 id="hali" class="counter">0</h2><p>Yıkanan Halı</p></div>
    </div>

    <div class="card">
        <h2>Hizmetlerimiz</h2>
        <div class="services">
            <div class="service-item">🧼 Halı</div>
            <div class="service-item">🛋️ Koltuk</div>
            <div class="service-item">🛏️ Yatak</div>
            <div class="service-item">🚿 Stor Perde</div>
        </div>
    </div>

    <div class="card">
        <h2>Neden Biz?</h2>
        <p style="text-align: left;">✅ Ücretsiz Servis<br>✅ Antibakteriyel İlaçlar<br>✅ Kapıda Ödeme Kolaylığı</p>
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400" alt="Temizlik 1">
            <img src="https://images.unsplash.com/photo-1598300056393-4aac492f4344?w=400" alt="Temizlik 2">
        </div>
    </div>

    <div class="card">
        <h2>Hızlı Teklif Al</h2>
        <form onsubmit="sendWhatsApp(event)">
            <input type="text" id="ad" placeholder="Adınız Soyadınız" required>
            <input type="tel" id="tel" placeholder="Telefon Numaranız" required>
            <textarea id="mesaj" rows="3" placeholder="Örn: 2 adet salon halısı, 1 adet köşe koltuk..." required></textarea>
            <button type="submit">Fiyat Bilgisi Gönder</button>
        </form>
    </div>
</div>

<!-- Alt Sabit Butonlar (Mobil İçin) -->
<div class="sticky-contact">
    <a href="tel:05362333675" class="call btn" style="margin:0 5px">📞 ARA</a>
    <a href="https://wa.me/905362333675" class="wp btn" style="margin:0 5px">💬 WHATSAPP</a>
</div>

<div id="popup" class="popup"></div>

<script>
    // Sayaç Fonksiyonu
    function animateCounter(el, target) {
        let current = 0;
        let step = target / 50;
        let timer = setInterval(() => {
            current += step;
            if (current >= target) {
                el.innerText = "+ " + Math.floor(target).toLocaleString('tr-TR');
                clearInterval(timer);
            } else {
                el.innerText = "+ " + Math.floor(current).toLocaleString('tr-TR');
            }
        }, 30);
    }

    window.onload = () => {
        animateCounter(document.getElementById('musteri'), 47177);
        animateCounter(document.getElementById('hali'), 235836);
    };

    // Bildirim Pop-up
    const names = ["Ahmet B.", "Merve Y.", "Caner K.", "Selin T.", "Mustafa A."];
    setInterval(() => {
        let p = document.getElementById('popup');
        let n = names[Math.floor(Math.random() * names.length)];
        p.innerText = "🔔 " + n + " az önce randevu oluşturdu.";
        p.style.display = 'block';
        setTimeout(() => p.style.display = 'none', 4000);
    }, 8000);

    // WhatsApp Formu
    function sendWhatsApp(e) {
        e.preventDefault();
        const ad = document.getElementById('ad').value;
        const tel = document.getElementById('tel').value;
        const mesaj = document.getElementById('mesaj').value;
        const text = Merhaba, Çayyolu Halı Yıkama Fiyat Teklifi İstiyorum:%0A%0A*Ad:* ${ad}%0A*Tel:* ${tel}%0A*İş:* ${mesaj};
        window.open(https://wa.me/905362333675?text=${text}, '_blank');
    }
</script>

</body>
</html>
